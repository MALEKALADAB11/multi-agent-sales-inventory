version: '3.9'

services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: asc_postgres
    environment:
      POSTGRES_DB:       asc_db
      POSTGRES_USER:     asc_user
      POSTGRES_PASSWORD: asc_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asc_user -d asc_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis/redis-stack:latest
    container_name: asc_redis
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  milvus:
    image: milvusdb/milvus:v2.4.0
    container_name: asc_milvus
    command: milvus run standalone
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS:  minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: asc_etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE:       revision
      ETCD_AUTO_COMPACTION_RETENTION:  "1000"
      ETCD_QUOTA_BACKEND_BYTES:        "4294967296"
      ETCD_SNAPSHOT_COUNT:             "50000"
    command: >
      etcd
      --advertise-client-urls=http://127.0.0.1:2379
      --listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    volumes:
      - etcd_data:/etcd

  minio:
    image: minio/minio:RELEASE.2023-03-13T19-46-17Z
    container_name: asc_minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/minio_data

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: asc_kafka
    environment:
      KAFKA_NODE_ID:                          1
      KAFKA_PROCESS_ROLES:                    broker,controller
      KAFKA_LISTENERS:                        PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS:             PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES:        CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP:   CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS:         1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CLUSTER_ID:                       asc-kafka-cluster
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5

  langfuse:
    image: langfuse/langfuse:latest
    container_name: asc_langfuse
    environment:
      DATABASE_URL:       postgresql://asc_user:asc_password@postgres:5432/asc_db
      NEXTAUTH_SECRET:    langfuse_secret_key
      NEXTAUTH_URL:       http://localhost:3001
      SALT:               langfuse_salt
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.11.0
    container_name: asc_mlflow
    command: >
      mlflow server
      --backend-store-uri postgresql://asc_user:asc_password@postgres:5432/asc_db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow/artifacts
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  etcd_data:
  minio_data:
  kafka_data:
  mlflow_data:
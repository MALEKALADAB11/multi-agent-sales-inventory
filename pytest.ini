[pytest]
testpaths = tests
python_files = test_*.py
markers =
    db: nécessite la base PostgreSQL ooredoo_sales locale
    integration: nécessite le serveur (uvicorn main:app) et/ou l'infra Docker
addopts = -q

# pytest-asyncio en mode auto : toute `async def test_*` et toute fixture
# asynchrone tournent sans décorateur. En mode `strict` (le défaut), une
# coroutine non marquée est silencieusement SAUTÉE avec un simple warning —
# c'est ce qui arrivait à tests/inventory/test_db.py, jamais exécuté depuis
# son écriture. Un test qui ne s'exécute pas est pire qu'un test absent.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

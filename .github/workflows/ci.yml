name: CI — Ooredoo AI Sales Coach

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Backend — Python tests
  # ─────────────────────────────────────────────────────────────────────────────
  backend-tests:
    name: Backend — pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB:       ooredoo_sales
          POSTGRES_USER:     postgres
          POSTGRES_PASSWORD: admin
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST:     localhost
      POSTGRES_PORT:     5432
      POSTGRES_DB:       ooredoo_sales
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: admin
      OPENROUTER_API_KEY: ""          # tests run without LLM
      PYTHONPATH: ${{ github.workspace }}/sales-module:${{ github.workspace }}/inventory-module

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov
          # Core deps — install lightweight versions without heavy ML models
          pip install fastapi uvicorn asyncpg psycopg2-binary pydantic python-dotenv
          pip install langgraph langchain langchain-core httpx
          # Test deps
          pip install -r sales-module/requirements-dev.txt || true

      - name: Run backend tests
        run: |
          pytest tests/ \
            sales-module/modules/coaching/agents/analyst/tests/ \
            -v --tb=short \
            --ignore=tests/test_hitl.py \
            -x

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: .coverage

  # ─────────────────────────────────────────────────────────────────────────────
  # Frontend — Angular build + unit tests
  # ─────────────────────────────────────────────────────────────────────────────
  frontend-tests:
    name: Frontend — ng build + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/PFE

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/PFE/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (prod)
        run: npx ng build --configuration production --no-progress

      - name: Unit tests (headless)
        run: npx ng test --watch=false --browsers=ChromeHeadless --code-coverage
        continue-on-error: true    # soft-fail until coverage improves

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/PFE/dist/

  # ─────────────────────────────────────────────────────────────────────────────
  # E2E — Playwright smoke tests (only on push to main)
  # ─────────────────────────────────────────────────────────────────────────────
  e2e:
    name: E2E — Playwright smoke
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/PFE/package-lock.json

      - name: Install Playwright
        working-directory: frontend/PFE
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Start backend (mock mode)
        run: |
          pip install fastapi uvicorn python-dotenv psycopg2-binary
          DATABASE_URL=sqlite:///test.db uvicorn main:app --port 8000 &
          sleep 5
        continue-on-error: true

      - name: Run Playwright smoke tests
        working-directory: frontend/PFE
        run: E2E_BASE_URL=http://localhost:4200 npx playwright test e2e/smoke.spec.ts --reporter=list
        continue-on-error: true    # E2E is informational until infra is stable

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/PFE/playwright-report/
